<style>
/* Layout: single phone column, sticky header, fixed bottom tab bar; plate colours double as the app's semantic palette */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --surface-2:#F5F6F8; --ink:#14181D; --muted:#5D6672; --line:#D7DBE0;
  --accent:#2350D3; --accent-ink:#FFFFFF; --accent-soft:#E2E9FB;
  --good:#16764B; --good-soft:#DCF2E6; --warn:#9C5600; --warn-soft:#FAEAD2;
  --p45:#2350D3; --p35:#D9AA00; --p25:#1C8749; --p10:#DDE1E6; --p5:#C3322B; --p2:#30353C; --sleeve:#B9C0C8;
  --scrim:rgba(14,17,20,.45);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1114; --surface:#161A1F; --surface-2:#1C2127; --ink:#ECEFF2; --muted:#98A1AC; --line:#2A3038;
  --accent:#7196FF; --accent-ink:#0A1022; --accent-soft:#1B2646;
  --good:#4FC48C; --good-soft:#11301F; --warn:#F1A64B; --warn-soft:#33240F;
  --p10:#C8CDD3; --p2:#555C66; --sleeve:#4A515B; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1114; --surface:#161A1F; --surface-2:#1C2127; --ink:#ECEFF2; --muted:#98A1AC; --line:#2A3038;
  --accent:#7196FF; --accent-ink:#0A1022; --accent-soft:#1B2646;
  --good:#4FC48C; --good-soft:#11301F; --warn:#F1A64B; --warn-soft:#33240F;
  --p10:#C8CDD3; --p2:#555C66; --sleeve:#4A515B; --scrim:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;min-height:56px;padding-block:6px}
header.top h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.2px;margin:0;line-height:1.05;flex:1;min-width:0;text-wrap:balance;overflow-wrap:anywhere}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 4px;display:flex;align-items:center;gap:2px;font-size:16px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;min-width:38px;padding:0 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none}
.iconbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px}

.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0;font-size:14px;flex:1 1 200px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;font-size:15px}

.ex{display:flex;align-items:center;gap:12px;padding:14px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.ex .name{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1;overflow-wrap:anywhere}
.ex .meta{font-size:14px;color:var(--muted)}
.chev{color:var(--muted);flex:none;font-size:20px}
.grow{flex:1;min-width:0}

.thumb{width:60px;height:60px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vcard{overflow:hidden}
.vimgbtn{display:block;width:100%;border:0;padding:0;background:var(--surface-2)}
.vimg{display:block;width:100%;aspect-ratio:16/10;max-width:100%;object-fit:cover;background:var(--surface-2)}
.va{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.va .name{font-size:19px}
.platebtn{border:0;background:none;padding:2px 0;font-size:12px;font-weight:600;color:var(--accent);text-align:center;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.platepad{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.pcell{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pcell .pv{font-family:var(--display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:5px}
.pcell .pv i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;font-weight:600;line-height:1}
.step b{min-width:20px;text-align:center;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.padfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.va .open{display:flex;gap:12px;align-items:flex-start;flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}

.va .last{font-size:14px;color:var(--muted);margin-top:2px}
.va .log{align-self:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px;margin-top:6px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.k-up{background:var(--good-soft);color:var(--good)}
.k-reps{background:var(--accent-soft);color:var(--accent)}
.k-hold{background:var(--warn-soft);color:var(--warn)}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.empty{padding:28px 18px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty h3{font-family:var(--display);font-size:22px;color:var(--ink);margin:0 0 6px}
.empty p{margin:0 0 14px}

.hero{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:var(--r);object-fit:cover;background:var(--surface-2);display:block;border:1px solid var(--line)}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.sugg{padding:14px;border-radius:var(--r);display:flex;flex-direction:column;gap:4px}
.sugg .t{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.sugg .b{font-size:15px}
.big{width:100%;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:17px;padding:15px}

.sess{padding:12px 14px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);display:flex;flex-direction:column;gap:8px}
.sess .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.sess .date{font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.setcell{background:var(--surface-2);border-radius:8px;padding:6px 8px;font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.setcell small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.setcell.top{box-shadow:inset 3px 0 0 var(--good)}
.setcell.below{box-shadow:inset 3px 0 0 var(--warn)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .tin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);overflow:auto;border-radius:18px 18px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-6px;background:var(--bg);padding-block:8px;z-index:2}
.sheet .sh h2{font-family:var(--display);font-size:26px;margin:0;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px;min-width:0}
textarea.in{min-height:72px;resize:vertical}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}

.setrow{display:grid;grid-template-columns:28px 1fr 18px 1.3fr 36px;gap:8px;align-items:center}
.setrow .n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);text-align:center}
.setrow .x{color:var(--muted);text-align:center;font-weight:600}
.setrow input{text-align:center;font-family:var(--display);font-size:22px;font-weight:600;padding:8px 6px;font-variant-numeric:tabular-nums}
.setrow .rm{border:0;background:none;color:var(--muted);font-size:22px;height:36px;border-radius:8px}
.setwrap{display:flex;flex-direction:column;gap:3px}
.setsub{display:grid;grid-template-columns:28px 1fr 18px 1.3fr 36px;gap:8px;font-size:12px;color:var(--muted);min-height:16px;line-height:1.3}
.subcol{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.setsub .plates{text-align:center;font-weight:600;color:var(--muted);overflow-wrap:anywhere;min-width:0}
.rb{font-weight:600}
.rb.top{color:var(--good)} .rb.below{color:var(--warn)} .rb.in{color:var(--accent)}
.colhead{display:grid;grid-template-columns:28px 1fr 18px 1.3fr 36px;gap:8px;font-size:12px;color:var(--muted);font-weight:600;text-align:center;letter-spacing:.06em;text-transform:uppercase}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.btn.danger{color:var(--p5);border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{flex:1}
.photoedit{display:flex;gap:12px;align-items:center}
.photoedit .thumb{width:84px;height:84px}
.ref{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}

/* confirm */
.dialog{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px}
.dialog .box{background:var(--surface);border-radius:16px;padding:18px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:14px}
.dialog p{margin:0;font-size:16px}

/* progress */
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chartbox{padding:10px 8px 6px}
.chartbox svg{width:100%;height:auto;display:block}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axis{fill:var(--muted);font-size:11px;font-family:var(--body)}
svg .line{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
svg .area{fill:var(--accent);opacity:.12}
svg .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
svg .end{fill:var(--accent)}
svg .endlabel{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--body)}

/* plates */
.weightin{font-family:var(--display);font-weight:700;font-size:56px;text-align:center;padding:6px 10px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;min-height:150px;padding:10px 12px;overflow-x:auto}
.sleeve{height:14px;width:26px;background:var(--sleeve);border-radius:3px 0 0 3px;flex:none}
.collar{height:30px;width:8px;background:var(--sleeve);flex:none;border-radius:2px;margin-right:2px}
.plate{flex:none;border-radius:4px;margin-right:2px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:700;font-size:12px;border:1px solid rgba(0,0,0,.12)}
.endcap{height:14px;flex:1;min-width:20px;background:var(--sleeve);border-radius:0 3px 3px 0}
.eq{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;z-index:70;max-width:calc(100% - 32px);text-align:center}
details summary{cursor:pointer;font-weight:600;color:var(--accent);padding:6px 0}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sec>h2{font-family:var(--display);font-size:22px;margin:0}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
</style>

<body>
<div id="app"></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importInput" accept=".json,application/json,text/plain" hidden>

<script>
(function(){
"use strict";
const LOAD_TYPES=['Total','Per side','Single arm','Bodyweight +','Assisted'];
const ATTACH=['None','Straight bar','EZ bar','V-bar','Rope','D-handle','Lat bar','Ankle cuff','Wrist cuffs','Other'];
const PLATES=[45,35,25,10,5,2.5];

let S={exercises:[],variations:[],sessions:[],seeded:false};
const ui={tab:'lift',stack:[{v:'home'}],q:'',prog:{ex:null,va:null,metric:'top'},sheet:null,confirm:null,backupText:null};
const app=document.getElementById('app');

/* ---------- storage ---------- */
let idb=null; const mem={kv:{},photos:{}}; const photoCache={};
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('overload-lift-log',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos');};r.onsuccess=()=>{idb=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false);setTimeout(()=>res(!!idb),3000);}catch(e){res(false)}})}
function tx(store,mode,fn){return new Promise((res,rej)=>{try{const t=idb.transaction(store,mode);const rq=fn(t.objectStore(store));t.oncomplete=()=>res(rq?rq.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}})}
async function kvGet(k){if(idb){try{return await tx('kv','readonly',s=>s.get(k))}catch(e){}}return mem.kv[k]}
async function kvSet(k,v){mem.kv[k]=v;if(idb){try{await tx('kv','readwrite',s=>s.put(v,k))}catch(e){toast('Could not save. Storage may be full.')}}}
async function photoGet(id){if(!id)return null;if(photoCache[id])return photoCache[id];let d=mem.photos[id];if(!d&&idb){try{d=await tx('photos','readonly',s=>s.get(id))}catch(e){}}if(d)photoCache[id]=d;return d||null}
async function photoPut(id,data){photoCache[id]=data;mem.photos[id]=data;if(idb){try{await tx('photos','readwrite',s=>s.put(data,id))}catch(e){toast('Could not save photo.')}}}
async function photoDel(id){delete photoCache[id];delete mem.photos[id];if(idb){try{await tx('photos','readwrite',s=>s.delete(id))}catch(e){}}}
async function photoClear(){for(const k in photoCache)delete photoCache[k];mem.photos={};if(idb){try{await tx('photos','readwrite',s=>s.clear())}catch(e){}}}
let saveT=null;function save(){clearTimeout(saveT);saveT=setTimeout(()=>kvSet('state',JSON.parse(JSON.stringify(S))),150)}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function fmtDate(s,long){if(!s)return'';const d=parseD(s);const now=new Date();const o={weekday:'short',month:'short',day:'numeric'};if(d.getFullYear()!==now.getFullYear())o.year='numeric';if(!long){const diff=Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate())-d)/864e5);if(diff===0)return'Today';if(diff===1)return'Yesterday';}return d.toLocaleDateString(undefined,o)}
const fmtW=n=>{n=Number(n);if(!isFinite(n))return'';return Math.round(n*100)/100+''};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const ex=id=>S.exercises.find(e=>e.id===id);
const va=id=>S.variations.find(v=>v.id===id);
const varsOf=exId=>S.variations.filter(v=>v.exerciseId===exId).sort((a,b)=>a.created-b.created);
const sessOf=vaId=>S.sessions.filter(s=>s.variationId===vaId).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
const lastSess=vaId=>sessOf(vaId)[0]||null;
function vaName(v){if(v.name&&v.name.trim())return v.name.trim();const i=varsOf(v.exerciseId).indexOf(v);return 'Variation '+(i+1)}
function lastTrainedEx(exId){let best=null;for(const v of varsOf(exId)){const s=lastSess(v.id);if(s&&(!best||s.date>best))best=s.date}return best}
function attachLabel(s){if(!s.attachment||s.attachment==='None')return'';return s.attachment==='Other'?(s.attachOther||'Other'):s.attachment}
function setsSummary(sets){const ws=sets.map(s=>s.weight);const same=ws.every(w=>w===ws[0]);if(same)return sets.map(s=>s.reps).join(', ')+' @ '+fmtW(ws[0])+' lb';return sets.map(s=>fmtW(s.weight)+'×'+s.reps).join(', ')}
function repClass(r,e){if(r==null||r==='')return'';if(r>=e.repHigh)return'top';if(r<e.repLow)return'below';return'in'}

function suggestion(e,s){
  if(!s||!s.sets.length)return{k:'new',label:'New',t:'Set your baseline',b:`No sessions yet. Aim for ${e.repLow}–${e.repHigh} reps per set.`};
  const sets=s.sets;const hi=e.repHigh,lo=e.repLow;
  if(sets.every(x=>x.reps>=hi))return{k:'up',label:'Go up',t:'Go up in weight',b:`Last time every set hit ${hi}+ reps. Add weight this session.`};
  const below=sets.map((x,i)=>x.reps<lo?i+1:0).filter(Boolean);
  if(below.length)return{k:'hold',label:'Hold',t:'Stay at this weight',b:`Set ${below.join(', ')} fell under ${lo} reps. Repeat the weight and get every set to ${lo}+.`};
  const tgt=sets.map(x=>fmtW(x.weight)+'×'+Math.min(x.reps+1,hi)).join(', ');
  return{k:'reps',label:'Add reps',t:'Add reps',b:`Same weight, beat last time. Target: ${tgt}.`};
}

/* ---------- icons ---------- */
const I={
  lift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M6 7v10M9 5v14M15 5v14M18 7v10"/></svg>',
  prog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18M5 15l4-4 4 3 6-7"/></svg>',
  plates:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/></svg>',
  data:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>',
  cam:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'
};

/* ---------- render ---------- */
function render(){
  let main='';
  if(ui.tab==='lift'){const top=ui.stack[ui.stack.length-1];main=top.v==='home'?vHome():top.v==='exercise'?vExercise(top.id):vVariation(top.id)}
  else if(ui.tab==='prog')main=vProgress();
    else main=vData();
  const tab=(k,label)=>`<button data-act="tab" data-id="${k}" ${ui.tab===k?'aria-current="page"':''}>${I[k]}<span>${label}</span></button>`;
  app.innerHTML=`<div class="wrap">${main}</div><nav class="tabs"><div class="tin">${tab('lift','Lifts')}${tab('prog','Progress')}${tab('data','Data')}</div></nav>${ui.sheet?vSheet():''}${ui.confirm?vConfirm():''}`;
  hydratePhotos();
}
function hydratePhotos(){document.querySelectorAll('[data-pid]').forEach(async el=>{const d=await photoGet(el.dataset.pid);if(d){if(el.tagName==='IMG')el.src=d;else el.innerHTML=`<img alt="" src="${d}">`}})}
function thumb(v,cls){return v&&v.photoId?`<div class="${cls||'thumb'}" data-pid="${esc(v.photoId)}"></div>`:`<div class="${cls||'thumb'}" aria-hidden="true">${I.cam}</div>`}

function vHome(){
  const hasEx=S.exercises.some(e=>e.example);
  const body=homeList();
  return`<header class="top"><h1>Lifts</h1><button class="iconbtn primary" data-act="add-ex" aria-label="Add exercise">+ Exercise</button></header>
  <div class="stack">${hasEx?`<div class="banner"><p>The incline and row entries are examples so you can see how it works.</p><button class="linkbtn" data-act="clear-examples">Remove examples</button></div>`:''}
  ${S.exercises.length?`<input class="search" id="search" type="search" placeholder="Search exercises or machines" value="${esc(ui.q)}" autocomplete="off">`:''}
  <div class="stack" id="exlist">${body}</div></div>`;
}
function homeList(){
  const q=ui.q.trim().toLowerCase();
  let list=S.exercises.map(e=>({e,last:lastTrainedEx(e.id)}));
  if(q)list=list.filter(({e})=>e.name.toLowerCase().includes(q)||varsOf(e.id).some(v=>(v.name||'').toLowerCase().includes(q)));
  list.sort((a,b)=>(b.last||'').localeCompare(a.last||'')||a.e.name.localeCompare(b.e.name));
  let body='';
  if(!S.exercises.length)body=`<div class="empty"><h3>No exercises yet</h3><p>Add a parent exercise like “Incline Bench Press”, then add each machine as a variation.</p><button class="btn primary" data-act="add-ex">Add exercise</button></div>`;
  else if(!list.length)body=`<p class="muted">Nothing matches “${esc(ui.q)}”.</p>`;
  else body=list.map(({e,last})=>{const n=varsOf(e.id).length;return`<button class="ex" data-act="open-ex" data-id="${e.id}"><div class="grow"><div class="name">${esc(e.name)}</div><div class="meta num">${n} variation${n===1?'':'s'} · ${e.repLow}–${e.repHigh} reps${last?' · '+fmtDate(last):''}</div></div><span class="chev">›</span></button>`}).join('');
  return body;
}

function vExercise(id){
  const e=ex(id);if(!e){ui.stack=[{v:'home'}];return vHome()}
  const vs=varsOf(id);

  ${v.note?`<div class="note">${esc(v.note)}</div>`:''}

/* ---------- progress ---------- */
const METRICS={top:'Top weight',e1rm:'Est. 1-rep max',vol:'Volume'};
function metricVal(s,m){if(m==='top')return Math.max(...s.sets.map(x=>x.weight));if(m==='vol')return s.sets.reduce((a,x)=>a+x.weight*x.reps,0);return Math.max(...s.sets.map(x=>x.weight*(1+x.reps/30)))}
function vProgress(){
  const exs=S.exercises.filter(e=>varsOf(e.id).some(v=>sessOf(v.id).length)).sort((a,b)=>a.name.localeCompare(b.name));
  if(!exs.length)return`<header class="top"><h1>Progress</h1></header><div class="empty"><h3>No sessions yet</h3><p>Log a session on any machine and its chart appears here.</p><button class="btn" data-act="tab" data-id="lift">Go to Lifts</button></div>`;
  let P=ui.prog;
  if(!P.ex||!exs.find(e=>e.id===P.ex)){let best=null;for(const e of exs){const l=lastTrainedEx(e.id);if(!best||l>best.l)best={e,l}}P.ex=best.e.id;P.va=null}
  const vs=varsOf(P.ex).filter(v=>sessOf(v.id).length);
  if(!P.va||!vs.find(v=>v.id===P.va)){P.va=vs.slice().sort((a,b)=>lastSess(b.id).date.localeCompare(lastSess(a.id).date))[0].id}
  const e=ex(P.ex),v=va(P.va);
  const ss=sessOf(P.va).slice().reverse();
  const pts=ss.map(s=>({d:s.date,y:metricVal(s,P.metric)}));
  const first=pts[0].y,last=pts[pts.length-1].y,ch=last-first;
  const mixed=new Set(ss.map(s=>s.loadType)).size>1;
  const unit='lb';
  const fmtM=y=>P.metric==='vol'?Math.round(y).toLocaleString():fmtW(Math.round(y*10)/10);
  return`<header class="top"><h1>Progress</h1></header><div class="stack">
  <div class="two"><div class="field"><label for="pEx">Exercise</label><select class="in" id="pEx">${exs.map(x=>`<option value="${x.id}" ${x.id===P.ex?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
  <div class="field"><label for="pVa">Machine</label><select class="in" id="pVa">${vs.map(x=>`<option value="${x.id}" ${x.id===P.va?'selected':''}>${esc(vaName(x))}</option>`).join('')}</select></div></div>
  <div class="chips">${Object.entries(METRICS).map(([k,l])=>`<button class="chip" data-act="metric" data-id="${k}" aria-pressed="${P.metric===k}">${l}</button>`).join('')}</div>
  <div class="statrow"><div class="stat"><div class="label">Latest</div><div class="v">${fmtM(last)}</div></div><div class="stat"><div class="label">Change</div><div class="v" style="color:${ch>0?'var(--good)':ch<0?'var(--warn)':'var(--ink)'}">${ch>0?'+':''}${fmtM(ch)}</div></div><div class="stat"><div class="label">Sessions</div><div class="v">${ss.length}</div></div></div>
  <div class="card chartbox">${chart(pts,fmtM)}</div>
  <p class="muted small" style="margin:0">${METRICS[P.metric]} per session on ${esc(vaName(v))}, in ${unit} as entered.${P.metric==='e1rm'?' Estimated from your best set (Epley formula).':''}${P.metric==='vol'?' Volume is reps × weight added up across sets.':''}${mixed?' <strong>Heads up:</strong> this machine has sessions logged with different weight types, so points may not compare directly.':''}</p>
  </div>`;
}
function niceStep(r){if(r<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(r)));const n=r/p;return(n<1.5?1:n<3?2:n<7?5:10)*p}
function chart(pts,fmt){
  const W=340,H=210,pl=44,pr=18,pt=22,pb=28;const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);
  if(lo===hi){lo-=Math.max(5,lo*.05);hi+=Math.max(5,hi*.05)}const padv=(hi-lo)*.15;lo=Math.max(0,lo-padv);hi+=padv;
  const step=niceStep((hi-lo)/3);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const ts=pts.map(p=>parseD(p.d).getTime());const t0=ts[0],t1=ts[ts.length-1];
  const X=t=>t1===t0?pl+(W-pl-pr)/2:pl+(t-t0)/(t1-t0)*(W-pl-pr);const Y=y=>pt+(1-(y-lo)/(hi-lo))*(H-pt-pb);
  let g='';for(let y=lo;y<=hi+1e-9;y+=step){g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(y)}" y2="${Y(y)}"/><text class="axis" x="${pl-6}" y="${Y(y)+4}" text-anchor="end">${fmt(y)}</text>`}
  const xy=pts.map((p,i)=>[X(ts[i]),Y(p.y)]);const path=xy.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area=xy.length>1?`<path class="area" d="${path} L${xy[xy.length-1][0].toFixed(1)} ${H-pb} L${xy[0][0].toFixed(1)} ${H-pb} Z"/>`:'';
  const dots=xy.slice(0,-1).map(q=>`<circle class="dot" cx="${q[0]}" cy="${q[1]}" r="3.5"/>`).join('');const e=xy[xy.length-1];
  const lbl=(d,x,anchor)=>`<text class="axis" x="${x}" y="${H-8}" text-anchor="${anchor}">${esc(parseD(d).toLocaleDateString(undefined,{month:'short',day:'numeric'}))}</text>`;
  const xl=pts.length>1?lbl(pts[0].d,pl,'start')+lbl(pts[pts.length-1].d,W-pr,'end'):lbl(pts[0].d,e[0],'middle');
  const ex2=Math.min(e[0],W-pr-4);
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">${g}${area}${xy.length>1?`<path class="line" d="${path}"/>`:''}${dots}<circle class="end" cx="${e[0]}" cy="${e[1]}" r="5.5"/><text class="endlabel" x="${ex2}" y="${Math.max(13,e[1]-10)}" text-anchor="${e[0]>W-60?'end':'middle'}">${fmt(pts[pts.length-1].y)}</text>${xl}</svg>`;
}

/* ---------- plates ---------- */
function plateMath(w){const av=PLATES;const out=[];let rem=Math.round(w*100)/100;for(const p of av){while(rem>=p-1e-9&&out.length<60){out.push(p);rem=Math.round((rem-p)*100)/100}}return{out,rem}}
function greedyCounts(w){const {out,rem}=plateMath(w);const c={};out.forEach(p=>c[p]=(c[p]||0)+1);return{c,rem}}
function plateSum(c){return Math.round(Object.entries(c).reduce((a,[p,n])=>a+Number(p)*n,0)*100)/100}
function setPlates(st){if(st.plates)return{c:st.plates,rem:0};const w=num(st.weight);if(w==null||w<=0)return{c:{},rem:0};return greedyCounts(w)}
function plateLabel(st){const {c,rem}=setPlates(st);const t=Object.keys(c).filter(p=>c[p]>0).map(Number).sort((a,b)=>b-a).map(p=>(c[p]>1?c[p]+'×':'')+fmtW(p)).join(' + ');if(!t)return'Add by plates';return t+(rem>0?` · ${fmtW(rem)} left`:'')}
function plateText(wv){const w=num(wv);if(w==null||w<=0)return'';const {out,rem}=plateMath(w);const c={};out.forEach(p=>c[p]=(c[p]||0)+1);
  const t=Object.keys(c).map(Number).sort((a,b)=>b-a).map(p=>(c[p]>1?c[p]+'×':'')+fmtW(p)).join(' + ');return (t||'—')+(rem>0?` · ${fmtW(rem)} left`:'')}

}
const PDOT={45:'--p45',35:'--p35',25:'--p25',10:'--p10',5:'--p5',2.5:'--p2'};
function platePad(st,i){const {c}=setPlates(st);return`<div class="platepad">${PLATES.map(p=>`<div class="pcell"><span class="pv"><i style="background:var(${PDOT[p]})"></i>${fmtW(p)}</span><span class="step"><button data-act="pl" data-id="${i}:${p}:-1" aria-label="Remove a ${fmtW(p)}">−</button><b>${c[p]||0}</b><button data-act="pl" data-id="${i}:${p}:1" aria-label="Add a ${fmtW(p)}">+</button></span></div>`).join('')}<div class="padfoot"><span class="num">Total ${fmtW(plateSum(c))} lb</span><button class="linkbtn" data-act="pad" data-id="${i}">Done</button></div></div>`}
function rbText(c,e){return c==='top'?`Top of range`:c==='below'?`Under ${e.repLow}`:c==='in'?'In range':''}
function vConfirm(){const c=ui.confirm;return`<div class="dialog"><div class="box" role="alertdialog" aria-modal="true"><p>${esc(c.text)}</p><div class="btnrow"><button class="btn wide" data-act="no">Cancel</button><button class="btn wide ${c.danger?'danger':'primary'}" data-act="yes">${esc(c.yes)}</button></div></div></div>`}

let toastT;function toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2400)}

/* ---------- actions ---------- */

function readLogFields(){const d=ui.sheet.d;const g=id=>document.getElementById(id);if(g('lgDate'))d.date=g('lgDate').value||today();if(g('lgLoad'))d.loadType=g('lgLoad').value;if(g('lgAtt'))d.attachment=g('lgAtt').value;if(g('lgAttOther'))d.attachOther=g('lgAttOther').value;if(g('lgNote'))d.note=g('lgNote').value}
function keepScroll(fn){const s=document.querySelector('.sheet');const y=s?s.scrollTop:0;fn();const s2=document.querySelector('.sheet');if(s2)s2.scrollTop=y}

const A={
  tab(id){if(ui.tab===id&&id==='lift')ui.stack=[{v:'home'}];ui.tab=id;ui.backupText=null;render();window.scrollTo(0,0)},
  'open-ex'(id){ui.stack.push({v:'exercise',id});render();window.scrollTo(0,0)},

  'save-ex'(){const name=document.getElementById('exName').value.trim();let lo=parseInt(document.getElementById('exLo').value,10),hi=parseInt(document.getElementById('exHi').value,10);
    if(!name){toast('Give the exercise a name');return}if(!(lo>0)||!(hi>0)){toast('Rep range needs two numbers, like 4 and 6');return}if(lo>hi)[lo,hi]=[hi,lo];
    const id=ui.sheet.id;if(id){const e=ex(id);e.name=name;e.repLow=lo;e.repHigh=hi;e.example=false}else{const nid=uid();S.exercises.push({id:nid,name,repLow:lo,repHigh:hi,created:Date.now()});ui.stack=[{v:'home'},{v:'exercise',id:nid}]}
    ui.sheet=null;save();render();toast(id?'Saved':'Exercise added')},
  'del-ex'(){const id=ui.sheet.id;const e=ex(id);ask(`Delete “${e.name}” and all of its machines and history?`,'Delete',async()=>{for(const v of varsOf(id)){if(v.photoId)await photoDel(v.photoId);S.sessions=S.sessions.filter(s=>s.variationId!==v.id)}S.variations=S.variations.filter(v=>v.exerciseId!==id);S.exercises=S.exercises.filter(x=>x.id!==id);ui.sheet=null;ui.stack=[{v:'home'}];save();render();toast('Exercise deleted')})},
  'add-va'(id){ui.sheet={type:'va',id:null,exId:id,d:{name:'',note:'',photo:null,photoChanged:false}};render()},
  async 'edit-va'(id){const v=va(id);const p=v.photoId?await photoGet(v.photoId):null;ui.sheet={type:'va',id,exId:v.exerciseId,d:{name:v.name||'',note:v.note||'',photo:p,photoChanged:false}};render()},
  'pick-photo'(){const i=document.getElementById('photoInput');i.value='';i.click()},
  'rm-photo'(){const d=ui.sheet.d;d.name=document.getElementById('vaName').value;d.note=document.getElementById('vaNote').value;d.photo=null;d.photoChanged=true;keepScroll(render)},
  async 'save-va'(){const sh=ui.sheet,d=sh.d;d.name=document.getElementById('vaName').value.trim();d.note=document.getElementById('vaNote').value.trim();
    let v;if(sh.id){v=va(sh.id)}else{v={id:uid(),exerciseId:sh.exId,name:'',note:'',photoId:null,created:Date.now()};S.variations.push(v)}
    v.name=d.name;v.note=d.note;
    if(d.photoChanged){if(v.photoId)await photoDel(v.photoId);v.photoId=null;if(d.photo){v.photoId=uid();await photoPut(v.photoId,d.photo)}}
    const e=ex(v.exerciseId);if(e)e.example=false;
    ui.sheet=null;save();render();toast(sh.id?'Saved':'Variation added')},
  'del-va'(){const id=ui.sheet.id;const v=va(id);ask(`Delete “${vaName(v)}” and its ${sessOf(id).length} logged sessions?`,'Delete',async()=>{if(v.photoId)await photoDel(v.photoId);S.sessions=S.sessions.filter(s=>s.variationId!==id);S.variations=S.variations.filter(x=>x.id!==id);ui.sheet=null;if(ui.stack[ui.stack.length-1].id===id)ui.stack.pop();save();render();toast('Variation deleted')})},
  log(id){openLog(id)},
  'edit-sess'(id){const s=S.sessions.find(x=>x.id===id);openLog(s.variationId,id)},
  'add-set'(){readLogFields();const d=ui.sheet.d;const l=d.sets[d.sets.length-1];d.sets.push(l?{...l,plates:l.plates?{...l.plates}:undefined}:{reps:'',weight:''});ui.sheet.pad=null;keepScroll(render)},
  'dup-set'(){readLogFields();const d=ui.sheet.d;const l=d.sets[d.sets.length-1];if(l)d.sets.push({...l});keepScroll(render)},
  'rm-set'(i){readLogFields();ui.sheet.d.sets.splice(Number(i),1);ui.sheet.pad=null;keepScroll(render)},
  pad(i){readLogFields();i=Number(i);ui.sheet.pad=ui.sheet.pad===i?null:i;keepScroll(render)},
  pl(arg){readLogFields();const [i,p,dlt]=arg.split(':');const st=ui.sheet.d.sets[Number(i)];const c={...setPlates(st).c};c[p]=Math.max(0,(c[p]||0)+Number(dlt));
    for(const k in c)if(!c[k])delete c[k];st.plates=c;const sum=plateSum(c);st.weight=sum?fmtW(sum):'';keepScroll(render)},
  'save-log'(){readLogFields();const sh=ui.sheet,d=sh.d;
    const sets=[];for(const s of d.sets){const r=num(s.reps),w=num(s.weight);if(r==null||r<=0)continue;const o={reps:Math.round(r),weight:w==null?0:w};if(s.plates&&plateSum(s.plates)===o.weight)o.plates={...s.plates};sets.push(o)}
    if(!sets.length){toast('Enter reps for at least one set');return}
    const rec={date:d.date||today(),loadType:d.loadType,attachment:d.attachment,attachOther:d.attachment==='Other'?d.attachOther.trim():'',note:d.note.trim(),sets};
    if(sh.id)Object.assign(S.sessions.find(x=>x.id===sh.id),rec);else S.sessions.push({id:uid(),variationId:sh.vaId,created:Date.now(),...rec});
    const v=va(sh.vaId),e=v&&ex(v.exerciseId);if(e)e.example=false;
    ui.sheet=null;save();render();toast(sh.id?'Session updated':'Session saved')},
  'del-sess'(){const id=ui.sheet.id;ask('Delete this session?','Delete',()=>{S.sessions=S.sessions.filter(s=>s.id!==id);ui.sheet=null;save();render();toast('Session deleted')})},
  close(){ui.sheet=null;render()},
  no(){ui.confirm=null;render()},
  async yes(){const f=ui.confirm.fn;ui.confirm=null;await f()},
  metric(id){ui.prog.metric=id;render()},
  'clear-examples'(){ask('Remove the example exercises and their sessions?','Remove',()=>{const ids=S.exercises.filter(e=>e.example).map(e=>e.id);const vids=S.variations.filter(v=>ids.includes(v.exerciseId)).map(v=>v.id);S.sessions=S.sessions.filter(s=>!vids.includes(s.variationId));S.variations=S.variations.filter(v=>!vids.includes(v.id));S.exercises=S.exercises.filter(e=>!ids.includes(e.id));save();render();toast('Examples removed')})},
  async export(){const txt=await backupJSON();const name=`overload-backup-${today()}.json`;
    try{const file=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Overload backup'});toast('Backup shared');return}}catch(e){if(e&&e.name==='AbortError')return}
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('Backup file created')}catch(e){A['export-text']()}},
  async 'export-text'(){const txt=await backupJSON();ui.backupText=txt;render();try{await navigator.clipboard.writeText(txt);toast('Backup copied')}catch(e){const t=document.getElementById('backupText');if(t){t.focus();t.select()}toast('Select the text and copy it')}},
  import(){const i=document.getElementById('importInput');i.value='';i.click()},
  'import-text'(){const t=document.getElementById('pasteText').value;restoreFrom(t)},
  wipe(){ask('Delete every exercise, machine, photo and session on this phone? This can’t be undone.','Delete all',async()=>{S={exercises:[],variations:[],sessions:[],seeded:true};await photoClear();ui.stack=[{v:'home'}];save();render();toast('All data deleted')})}
};

async function backupJSON(){const photos={};for(const v of S.variations){if(v.photoId){const d=await photoGet(v.photoId);if(d)photos[v.photoId]=d}}return JSON.stringify({app:'overload-lift-log',version:1,exportedAt:new Date().toISOString(),data:S,photos})}
function restoreFrom(txt){let o;try{o=JSON.parse(txt)}catch(e){toast('That isn’t a valid backup. Check you copied all of it.');return}
  if(!o||o.app!=='overload-lift-log'||!o.data||!Array.isArray(o.data.exercises)){toast('That file isn’t an Overload backup.');return}
  const n=o.data.sessions?o.data.sessions.length:0;
  ask(`Replace everything with this backup (${o.data.exercises.length} exercises, ${n} sessions)?`,'Restore',async()=>{S={exercises:o.data.exercises||[],variations:o.data.variations||[],sessions:o.data.sessions||[],seeded:true};await photoClear();for(const [k,v] of Object.entries(o.photos||{}))await photoPut(k,v);ui.stack=[{v:'home'}];ui.tab='lift';save();render();toast('Backup restored')},false)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act;
  if(act==='scrim'){if(e.target===t){ui.sheet=null;render()}return}
  if(A[act]){e.preventDefault();A[act](t.dataset.id)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='search'){ui.q=t.value;const l=document.getElementById('exlist');if(l)l.innerHTML=homeList();return}
    if(t.dataset&&t.dataset.set!=null&&ui.sheet&&ui.sheet.type==='log'){const i=Number(t.dataset.set);ui.sheet.d.sets[i][t.dataset.f]=t.value;
    if(t.dataset.f==='weight'){const st=ui.sheet.d.sets[i];delete st.plates;const pl=document.getElementById('pl'+i);if(pl)pl.textContent=plateLabel(st);if(ui.sheet.pad===i){const pad=pl.parentElement.nextElementSibling;if(pad&&pad.classList.contains('platepad'))pad.outerHTML=platePad(st,i)}}
    if(t.dataset.f==='reps'){const e2=ex(va(ui.sheet.vaId).exerciseId);const c=repClass(num(t.value),e2);const rb=document.getElementById('rb'+i);if(rb){rb.className='rb '+c;rb.textContent=rbText(c,e2)}}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='lgAtt'){const w=document.getElementById('attOtherWrap');if(w)w.hidden=t.value!=='Other'}
  if(t.id==='pEx'){ui.prog.ex=t.value;ui.prog.va=null;render()}
  if(t.id==='pVa'){ui.prog.va=t.value;render()}
});
document.getElementById('photoInput').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f||!ui.sheet||ui.sheet.type!=='va')return;
  const d=ui.sheet.d;d.name=document.getElementById('vaName').value;d.note=document.getElementById('vaNote').value;
  try{d.photo=await compress(f);d.photoChanged=true;keepScroll(render)}catch(err){toast('Couldn’t read that image. Try a different photo.')}
});
document.getElementById('importInput').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreFrom(String(r.result));r.onerror=()=>toast('Couldn’t read that file.');r.readAsText(f)});
function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const max=900;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);try{res(c.toDataURL('image/jpeg',0.72))}catch(e){rej(e)}};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'))};img.src=url})}

/* ---------- example data ---------- */
function seed(){
  const e1={id:uid(),name:'Incline Bench Press',repLow:4,repHigh:6,created:Date.now(),example:true};
  const e2={id:uid(),name:'Seated Cable Row',repLow:8,repHigh:12,created:Date.now()+1,example:true};
  const v1={id:uid(),exerciseId:e1.id,name:'Hammer Strength plate-loaded',note:'Seat on notch 4. Handles at chest height.',photoId:null,created:1};
  const v2={id:uid(),exerciseId:e1.id,name:'Smith machine, 30° bench',note:'',photoId:null,created:2};
  const v3={id:uid(),exerciseId:e2.id,name:'',note:'Chest pad 3',photoId:null,created:3};
  const mk=(vid,ago,lt,att,sets)=>({id:uid(),variationId:vid,created:Date.now()-ago*864e5,date:daysAgo(ago),loadType:lt,attachment:att,attachOther:'',note:'',sets:sets.map(([w,r])=>({weight:w,reps:r}))});
  S.exercises.push(e1,e2);S.variations.push(v1,v2,v3);
  S.sessions.push(
    mk(v1.id,24,'Per side','None',[[70,6],[70,5],[70,5]]),
    mk(v1.id,17,'Per side','None',[[70,6],[70,6],[70,6]]),
    mk(v1.id,10,'Per side','None',[[80,5],[80,5],[80,4]]),
    mk(v1.id,3,'Per side','None',[[80,6],[80,6],[80,5]]),
    mk(v2.id,13,'Total','None',[[135,6],[135,5],[135,5]]),
    mk(v2.id,6,'Total','None',[[135,6],[135,6],[135,6]]),
    mk(v3.id,8,'Total','V-bar',[[130,12],[130,11],[130,10]]),
    mk(v3.id,2,'Total','V-bar',[[130,12],[130,12],[130,12]])
  );
  S.seeded=true;
}

/* ---------- boot ---------- */
(async function boot(){
  await openDB();
  const st=await kvGet('state');
  if(st&&Array.isArray(st.exercises))S=st;
  if(!S.seeded){seed();save()}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  render();
})();
})();
</script>
